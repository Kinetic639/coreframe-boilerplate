# CI for the coreframe-boilerplate turborepo.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions)
# before every job here goes green:
#   NEXT_PUBLIC_SUPABASE_URL       - target Supabase project URL (public)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  - target Supabase anon/publishable key (public)
#   NEXT_PUBLIC_APP_URL            - e.g. https://app.ambra-system.com
#   NEXT_PUBLIC_SITE_URL           - e.g. https://app.ambra-system.com
#   NEXT_PUBLIC_MARKETING_SITE_URL - e.g. https://www.ambra-system.com
#   RESEND_API_KEY                 - only needed for the `build` job (email templates)
#   SUPABASE_SERVICE_ROLE_KEY      - `build`: public pages read site settings and
#                                    VMI data with the service client while they
#                                    prerender
#   SUPABASE_DB_URL                - `e2e`: production Postgres connection string
#                                    (session pooler). Only used to dump the schema
#                                    and reference tables into the job's own local
#                                    Supabase; the suite never calls production.
#
# Until secrets are added, `quality` (lint/types/unit tests) still runs and
# gates PRs on its own.

name: CI

on:
  push:
    branches: [main]
  # Work is merged into `development` (no deploy); merging development into
  # main releases: Vercel deploys main only (vercel.json).
  pull_request:
    # `closed` only cancels the PR's run still in progress (see concurrency):
    # after a merge the push to main runs everything again.
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, types, unit tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm check-types

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_MARKETING_SITE_URL: ${{ secrets.NEXT_PUBLIC_MARKETING_SITE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  e2e:
    name: E2E (apps/web)
    # The suite runs against a throwaway Supabase started inside this job
    # (apps/web/scripts/e2e-supabase/start.sh), never the production project:
    # production only answers one schema dump per run. So it runs on every PR
    # as well as on the release push to main.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_MARKETING_SITE_URL: http://127.0.0.1:3001
      # Read-only use: `supabase db dump` and a copy of the reference tables.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Exports NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
      # and the seeded E2E_TEST_EMAIL / E2E_TEST_PASSWORD for the steps below.
      - name: Start local Supabase
        working-directory: apps/web
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret (production session pooler connection string)."
            exit 1
          fi
          bash scripts/e2e-supabase/start.sh

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Builds a production server, boots it, runs the suite against it, then
      # tears it down -- see apps/web/scripts/run-e2e.mjs. Deliberately not
      # reusing the `build` job's output: this needs the full monorepo install
      # plus Playwright browsers, and keeping it self-contained keeps the job
      # simple to re-run in isolation.
      - name: Run e2e suite
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
